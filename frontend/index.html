<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Weather Station</title>
    <link rel="stylesheet" href="style.css?v=1.1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        
        <header class="macro-banner">
            <div class="macro-block">
                <span class="macro-label">Last Updated: <span id="ui-time">--:--</span></span>
            </div>
        </header>

        <main class="hero-section">
            <h2 class="zone-title" id="ui-zone-name">Loading...</h2>
            <div class="hero-temp" id="ui-temp">--&deg;</div>
            
            <div class="hero-context">
                <span>L: <span id="ui-low">--&deg;</span></span>
                <span class="divider">|</span>
                <span>H: <span id="ui-high">--&deg;</span></span>
                <span class="divider">|</span>
                <span>Hum: <span id="ui-humidity">--%</span></span>
                <span class="divider">|</span>
                <span>Dew Point: <span id="ui-dewpoint">--&deg;</span></span>
            </div>
            
            <div class="hero-context" style="font-size: 0.75rem; color: var(--text-secondary, #A0A0A0); margin-top: 4px;">
                <span>RSSI: <span id="ui-rssi">--</span> <span id="ui-rssi-trend"></span></span>
                <span class="divider">|</span>
                <span>Noise: <span id="ui-noise">--</span> <span id="ui-noise-trend"></span></span>
                <span class="divider">|</span>
                <span>SNR: <span id="ui-snr">--</span> <span id="ui-snr-trend"></span></span>
            </div>

            <div style="margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                <div id="sensor-read-time" style="color: var(--text-secondary); font-size: 0.9rem; display: none;">
                    Sensor read at: --:--
                </div>
                <div id="ui-battery-warning" style="color: #ff4444; font-size: 0.9rem; font-weight: bold; display: none;">
                    ⚠️ Low Battery
                </div>
            </div>
        </main>

        <nav class="zone-dropdown-container">
            <select id="sensor-dropdown"></select>
        </nav>

        <section class="global-telemetry">
            <div class="telemetry-block">
                <span class="telemetry-label">Relative Pressure</span>
                <span class="telemetry-value" id="ui-pressure">-- hPa</span>
                <span class="telemetry-sub" id="ui-pressure-time">--:--</span>
            </div>
            <div class="telemetry-block">
                <span class="telemetry-label">Wind Speed</span>
                
                <span class="telemetry-value" style="display: flex; align-items: center; justify-content: center;">
                    <span id="ui-wind">-- km/h</span>
                    
                    <svg id="ui-wind-compass" width="2.3em" height="2.3em" viewBox="0 0 24 24" style="margin-left: 8px; display: none;">
                        
                        <circle cx="12" cy="12" r="11" stroke="var(--text-secondary)" stroke-width="1.5" fill="none" />
                        
                        <text x="12" y="5.5" font-size="5" fill="#ff4444" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-weight="bold">N</text>
                        
                        <g id="ui-wind-trail-container"></g>
                        
                    </svg>
                </span>
                
                <span class="telemetry-sub">Avg. Last 15 min</span>
            </div>
            <div class="telemetry-block">
                <span class="telemetry-label">Wind Gusts</span>
                <span class="telemetry-value" id="ui-gust">-- km/h</span>
                <span class="telemetry-sub">Max Last 1 hr</span>
            </div>
            <div class="telemetry-block">
                <span class="telemetry-label">Rain (24h)</span>
                <span class="telemetry-value" id="ui-rain">-- mm</span>
                <span class="telemetry-sub">Total Accumulation</span>
            </div>
        </section>

        <section class="visualizer-section">
            <div class="wind-history-strip">
                <div id="ui-wind-history"></div>
            </div>
            <div class="chart-container">
                <canvas id="zone-chart"></canvas>
            </div>
        </section>

        <section class="pressure-trend-section">
            <div class="sparkline-container">
                <canvas id="pressure-sparkline"></canvas>
            </div>
        </section>

    </div>
    
    <script src="app.js?v=4.5"></script>
</body>
</html>
